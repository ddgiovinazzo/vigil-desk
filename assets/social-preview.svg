<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <!-- Background Radial Ambient Glow behind the Logo -->
    <radialGradient id="hero-halo" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#4f46e5" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Side Soft Lighting Accents -->
    <radialGradient id="side-cyan" cx="88%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="side-indigo" cx="12%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Squircle Gradient -->
    <linearGradient id="v2-logo-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle Inner Rim Highlight -->
    <linearGradient id="v2-logo-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Shield Face Lighting -->
    <linearGradient id="v2-shield-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="v2-shield-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Shield Inner Core -->
    <linearGradient id="v2-core-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="v2-core-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Rich 3D Drop Shadow for the Logo -->
    <filter id="v2-logo-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#020617" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>

    <!-- Pill Background Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Top Horizon Highlight Line -->
    <linearGradient id="v2-top-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0" />
      <stop offset="25%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Dot Grid Matrix -->
    <pattern id="dot-matrix" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#475569" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="640" fill="#07090e" />
  <rect width="1280" height="640" fill="url(#hero-halo)" />
  <rect width="1280" height="640" fill="url(#side-cyan)" />
  <rect width="1280" height="640" fill="url(#side-indigo)" />
  <rect width="1280" height="640" fill="url(#dot-matrix)" />

  <!-- Top Accent Horizon Line -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#v2-top-line)" />

  <!-- Outer Elegant Border Framing -->
  <rect x="14" y="14" width="1252" height="612" rx="28" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- ================= HERO EMBLEM (176x176, Centered at x=640, y=75) ================= -->
  <!-- 512 * 0.35156 = 180px -->
  <g transform="translate(550, 70)" filter="url(#v2-logo-shadow)">
    <g transform="scale(0.35156)">
      <!-- Squircle Base -->
      <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#v2-logo-bg)" />
      <!-- Subtle Rim Highlight -->
      <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="url(#v2-logo-rim)" stroke-width="3" />

      <!-- Outer Shield Left Facet -->
      <path
        d="M 256 100 C 232 122, 178 134, 124 134 C 122 258, 172 358, 256 414 Z"
        fill="url(#v2-shield-left)"
      />
      <!-- Outer Shield Right Facet -->
      <path
        d="M 256 100 C 280 122, 334 134, 388 134 C 390 258, 340 358, 256 414 Z"
        fill="url(#v2-shield-right)"
      />

      <!-- Inner Shield Inset (Core Negative Space) -->
      <path
        d="M 256 156 C 240 170, 202 180, 166 180 C 165 264, 198 334, 256 372 Z"
        fill="url(#v2-core-left)"
      />
      <path
        d="M 256 156 C 272 170, 310 180, 346 180 C 347 264, 314 334, 256 372 Z"
        fill="url(#v2-core-right)"
      />

      <!-- Center Vigil Star / AI Sparkle -->
      <path
        d="M 256 220 Q 256 250, 286 250 Q 256 250, 256 280 Q 256 250, 226 250 Q 256 250, 256 220 Z"
        fill="#ffffff"
      />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Project Title -->
  <text x="640" y="325" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">
    VigilDesk
  </text>

  <!-- Subtitle / Tagline -->
  <text x="640" y="375" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="-0.2">
    Autonomous Support Triage Agent &amp; Policy RAG Copilot
  </text>

  <!-- ================= SLEEK 3-PILLAR PILL ROW ================= -->
  <g transform="translate(640, 435)">
    <!-- Pill 1: Stateful HITL Guard -->
    <g transform="translate(-365, 0)">
      <rect width="230" height="46" rx="23" fill="url(#pill-bg)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.35" />
      <text x="24" y="29" font-size="16">🛡️</text>
      <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Stateful HITL Guard
      </text>
    </g>

    <!-- Pill 2: Policy-Grounded RAG -->
    <g transform="translate(-115, 0)">
      <rect width="230" height="46" rx="23" fill="url(#pill-bg)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" />
      <text x="24" y="29" font-size="16">📚</text>
      <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Policy-Grounded RAG
      </text>
    </g>

    <!-- Pill 3: Autonomous Pip Copilot -->
    <g transform="translate(135, 0)">
      <rect width="230" height="46" rx="23" fill="url(#pill-bg)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.35" />
      <text x="24" y="29" font-size="16">🤖</text>
      <text x="52" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
        Autonomous Copilot
      </text>
    </g>
  </g>

  <!-- ================= SUBTLE MINIMAL FOOTER ================= -->
  <text x="640" y="555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-size="12" font-weight="500" fill="#475569" text-anchor="middle" letter-spacing="1">
    PYTHON / FLASK • REACT / VITE • POSTGRESQL • ANYTHINGLLM
  </text>
</svg>
